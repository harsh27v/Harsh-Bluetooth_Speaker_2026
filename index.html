<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Bluetooth Speaker</title>
    <link href="css/grid.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
</head>
<body>
    
    <main class="grid-con center-grid-con">
        <section class="col-span-full hero-section">
            <div class="hero-content">
                <p class="hero-label">INTRODUCING SMALL</p>
                <h1>SMALL SIZE.<br>BIG SOUND.</h1>
                <p class="hero-description">NEW DIMENSIONS OF SOUND</p>
                <p class="scroll-text">SCROLL TO EXPLORE↓</p>
            </div>
        </section>
            
        <section class="col-span-full animation-section" id="speaker-animation">
            <h2 class="hidden">Speaker Animation</h2>
            <canvas id="explode-view" aria-label="Bluetooth Animation"></canvas>
        </section>
        <section class="col-span-full">
            <h2 class="hidden">Explore the 3D Speaker</h2>
            <model-viewer id="speaker-model" src="model/Speaker.glb" alt="3D Bluetooth speaker" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="images/poster.png" shadow-intensity="1">

                <button class="Hotspot" slot="hotspot-1" data-position="-0.017533293316967305m 0.018048816643195766m -0.0006090780577899453m" data-normal="0m 1m 0m" data-visibility-attribute="visible" aria-label="Bluetooth Controls">
                    <span class="HotspotAnnotation" id="hotspot-1"></span>
                </button>

                <button class="Hotspot" slot="hotspot-2" data-position="-0.045828734395354856m 0.0016256548378705618m 0.000569728162072316m" data-normal="-0.8944485792188215m 0.3092443433015352m -0.3230010453070298m" data-visibility-attribute="visible" aria-label="Fabric Grip">
                    <span class="HotspotAnnotation" id="hotspot-2"></span>
                </button>

                <button class="Hotspot" slot="hotspot-3" data-position="0.00006919139347475595m -0.01147664209983696m 0.01087501639865416m" data-normal="0m 3.422854266688091e-8m 0.9999999999999994m" data-visibility-attribute="visible" aria-label="AUX Input">
                    <span class="HotspotAnnotation" id="hotspot-3"></span>
                </button>

                <button class="Hotspot" slot="hotspot-4" data-position="-0.011355785871232737m -0.011628177651007678m 0.010696278663549642m" data-normal="0m -0.1331325987136977m 0.991098234868642m" data-visibility-attribute="visible" aria-label="USB-C Charging">
                    <span class="HotspotAnnotation" id="hotspot-4"></span>
                </button>

                <button slot="ar-button" id="ar-button">
                    View in your space
                </button>

            </model-viewer>
        
        </section>
        
        <section class="col-span-full xray-section">
            <h2 class="hidden">Explore the Internal Speaker Design</h2>
            <p class="xray-label">SMALL / INTERNAL VIEW</p>
            <div class="xray-container">
                <div class="xray-comparison">
                    <img class="normal-image" src="images/speaker-normal.png" alt="Normal exterior view of the speaker">
                    <div id="divisor">
                        <img class="xray-image" src="images/speaker-xray.png" alt="X-ray view showing the internal speaker components">
                    </div>
                </div>
                <input type="range" min="0" max="100" step="1" value="50" id="slider" aria-label="Reveal the internal speaker components">
            </div>
            <p class="xray-instruction">DRAG THE SLIDER TO EXPLORE THE INTERNAL DESIGN</p>
        </section>
    
    </main>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.0/ScrollTrigger.min.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
